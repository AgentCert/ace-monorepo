apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    LitmusChaos-native replacement for Chaos Mesh's PodChaos "pod-failure"
    action. Mirrors ITBench SRE scenario 18, whose disruption is a Chaos Mesh
    Schedule ("otel-demo-product-catalog-network-delay") wrapping a PodChaos
    with action=pod-failure, mode=all, selector
    app.kubernetes.io/component=checkout in namespace otel-demo -- i.e. it
    makes the otel-demo `checkout` service fail. This ACE deployment runs
    LitmusChaos only (no Chaos Mesh), so this fault reproduces the *effect*
    (target container becomes temporarily unresponsive without the pod being
    deleted or the container being killed/restarted) using LitmusChaos-native
    primitives.

    MECHANISM: for each Running pod matched by APP_LABEL, this fault attaches
    an ephemeral debug container to the pod (`kubectl debug ... --target`)
    that shares the target container's PID namespace, then sends SIGSTOP to
    PID 1 (the target process) to freeze it in place, holds for
    TOTAL_CHAOS_DURATION, then sends SIGCONT to resume it -- all from inside
    that one ephemeral container's own command, so the revert happens even if
    this experiment job is interrupted mid-run.

    WHY NOT A PLAIN `kubectl exec <pod> -c checkout -- kill -STOP 1`? That is
    the more obvious signal-based approximation, but it does not work against
    this specific target: checkout's image
    (ghcr.io/open-telemetry/demo:<tag>-checkout) is built
    `FROM gcr.io/distroless/static-debian12:nonroot` (confirmed against the
    upstream Dockerfile at the same opentelemetry-demo chart version, 0.40.9,
    that this ACE deployment pins), so the container has neither a shell nor
    a `kill` binary and `kubectl exec` into it cannot run anything at all.
    The ephemeral-debug-container approach is the standard, GA-since-1.25
    Kubernetes mechanism documented specifically for signalling/inspecting
    processes "in Containers that lack debugging utilities, such as with
    distroless images" (see
    https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/#ephemeral-container).
    It preserves full fidelity to the intended effect -- process frozen in
    place, pod/container never deleted or recreated, kubelet's restart
    machinery never triggered -- so it is not a lower-fidelity fallback, just
    a different delivery mechanism for the same signal.

    KNOWN CAVEATS (documented rather than silently absorbed):
      1. Requires the Kubernetes Ephemeral Containers feature (stable/default
         since v1.25) and a container runtime that honors `--target`
         (containerd/CRI-O do). minKubeVersion is therefore set to 1.25.0 in
         this fault's ChartServiceVersion, not the repo's usual 1.12.0.
      2. The ephemeral debug container itself cannot be individually removed
         once added (a Kubernetes API limitation -- only deleting the whole
         Pod clears it), so `kubectl describe pod` will keep showing a
         `Completed` `chaos-freeze-*` ephemeral container after this fault
         reverts. This is a harmless but visible side effect that differs
         from Chaos Mesh's own pod-failure (which leaves no such trace).
      3. checkout has no configured livenessProbe/readinessProbe (neither in
         ACE's values.yaml nor in the upstream chart's defaults), so
         `kubectl get pods` continues to show it Running/Ready throughout the
         freeze. This is not a shortcoming of this fault -- Chaos Mesh's own
         maintainers document that their pause-image swap "could work
         properly well with unconfigured command in the container. So if the
         container is configured without command, livenessProbe and
         readinessProbe, the container would be inspected as Running and
         Ready" too. The real, detectable symptom for this exact target is
         therefore in request-level metrics/traces, not pod phase/readiness.
kind: ChaosExperiment
metadata:
  name: chaos-mesh-pod-failure-replacement
  labels:
    name: chaos-mesh-pod-failure-replacement
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]
      - apiGroups: [""]
        resources: ["pods/ephemeralcontainers"]
        verbs: ["get", "patch", "update"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "litmuschaos/k8s:latest"
    imagePullPolicy: Always
    command:
      - /bin/sh
    args:
      - -c
      - |
        set -eu
        # The chaos-operator on this cluster declares APP_NAMESPACE/APP_LABEL/APP_KIND
        # as env var names but never populates their values from
        # ChaosEngine.spec.appinfo -- verified empirically (a real ChaosEngine
        # submission mistargeted an unrelated deployment because both vars were
        # empty). This operator version instead sets a single combined TARGETS var,
        # format "<kind>:<namespace>:[<label-selector>]:<mode>". Derive the vars
        # every fault-injection script here still expects from it, and only fall
        # back to whatever APP_KIND/APP_NAMESPACE/APP_LABEL already say if TARGETS
        # isn't set (e.g. a future/different operator version that does populate
        # them directly).
        if [ -n "${TARGETS:-}" ]; then
          APP_NAMESPACE=$(echo "$TARGETS" | cut -d: -f2)
          APP_LABEL=$(echo "$TARGETS" | cut -d: -f3 | tr -d '[]')
        fi
        # ChaosEngine.spec.appinfo.appkind is CRD-validated to a fixed enum
        # (deployment|statefulset|daemonset|deploymentconfig|rollout|job) --
        # "pod" is rejected outright at admission time. This fault always
        # targets a pod, never any other kind, so hardcode it here instead
        # of trusting TARGETS' kind component (the ChaosEngine submission uses
        # a dummy CRD-valid appkind like "deployment" purely to satisfy the
        # schema; only appns/applabel need to vary per submission).
        APP_KIND="pod"
        echo "Resolving target ${APP_KIND}s in ns=${APP_NAMESPACE} label=${APP_LABEL}"
        PODS=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" \
          --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}')
        if [ -z "$PODS" ]; then
          echo "no Running ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
          exit 1
        fi
        echo "Target pods: ${PODS}"

        # See the ChaosExperiment description for the full rationale: a
        # plain `kubectl exec <pod> -c ${TARGET_CONTAINER} -- kill -STOP 1`
        # cannot run here because the container image is distroless (no
        # shell, no kill binary). We instead attach an ephemeral debug
        # container that shares the target container's PID namespace and
        # send the signal from there.
        TS=$(date +%s)
        for POD in $PODS; do
          DEBUG_NAME=$(echo "chaos-freeze-${TS}-${POD}" | cut -c1-63 | sed 's/-*$//')
          echo "Injecting: freezing pod=${POD} container=${TARGET_CONTAINER} via ephemeral debug container=${DEBUG_NAME} (image=${DEBUG_IMAGE})"
          kubectl debug -n "${APP_NAMESPACE}" "${POD}" \
            --image="${DEBUG_IMAGE}" \
            --container="${DEBUG_NAME}" \
            --target="${TARGET_CONTAINER}" \
            --attach=false \
            -- sh -c "kill -STOP 1; sleep ${TOTAL_CHAOS_DURATION}; kill -CONT 1"
        done

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s (each ephemeral debug container independently runs its own STOP -> sleep -> CONT sequence, so the freeze self-reverts even if this experiment job is interrupted)"
        sleep "${TOTAL_CHAOS_DURATION}"

        echo "Fault duration elapsed. Ephemeral debug container state per target pod:"
        for POD in $PODS; do
          DEBUG_NAME=$(echo "chaos-freeze-${TS}-${POD}" | cut -c1-63 | sed 's/-*$//')
          REASON=$(kubectl get pod -n "${APP_NAMESPACE}" "${POD}" \
            -o jsonpath="{.status.ephemeralContainerStatuses[?(@.name=='${DEBUG_NAME}')].state.terminated.reason}" 2>/dev/null || true)
          echo "pod=${POD} debugContainer=${DEBUG_NAME} terminated=${REASON:-<not yet reported>}"
        done
        echo "NOTE: ephemeral debug containers cannot be individually removed (Kubernetes API limitation) -- they remain visible (Completed) under 'kubectl describe pod' until the Pod itself is deleted/recreated. This is an expected, documented side effect of this fault's mechanism, not a bug."
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo
      - name: APP_NAMESPACE
        value: "otel-demo"
      - name: APP_LABEL
        value: "opentelemetry.io/name=checkout"
      - name: APP_KIND
        value: "pod"

      # container (within the matched pod) whose main process gets frozen
      - name: TARGET_CONTAINER
        value: "checkout"

      # image used for the ephemeral debug container; must include a shell
      # and a `kill` binary supporting -STOP/-CONT (busybox does)
      - name: DEBUG_IMAGE
        value: "busybox:1.36"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: chaos-mesh-pod-failure-replacement
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
---
---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Sets a container's image to a tag built only for an unsupported CPU
    architecture (e.g. an arm64-only image on an amd64 node), causing the
    pod to become stuck Pending in ImagePullBackOff/ErrImagePull, then
    restores the original image. Mirrors ITBench SRE scenarios 23, 57 and 60
    (fault library index 26,
    "unsupported-architecture-kubernetes-workload-container-image"), which
    all target the otel-demo `checkout` Deployment.
kind: ChaosExperiment
metadata:
  name: unsupported-architecture-kubernetes-workload-container-image
  labels:
    name: unsupported-architecture-kubernetes-workload-container-image
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
