apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Patches the OpenTelemetry Demo's 'flagd-config' ConfigMap, setting a named
    feature flag's defaultVariant (e.g. to "on"), then restores its original
    value. Mirrors ITBench SRE scenario "opentelemetry-demo-feature-flag"
    (fault library index 18).
kind: ChaosExperiment
metadata:
  name: opentelemetry-demo-feature-flag
  labels:
    name: opentelemetry-demo-feature-flag
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["configmaps"]
        verbs: ["get", "patch"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "litmuschaos/k8s:latest"
    imagePullPolicy: Always
    command:
      - /bin/sh
    args:
      - -c
      - |
        set -eu
        # The chaos-operator on this cluster declares APP_NAMESPACE/APP_LABEL/APP_KIND
        # as env var names but never populates their values from
        # ChaosEngine.spec.appinfo -- verified empirically (a real ChaosEngine
        # submission mistargeted an unrelated deployment because both vars were
        # empty). This operator version instead sets a single combined TARGETS var,
        # format "<kind>:<namespace>:[<label-selector>]:<mode>". Derive the vars
        # every fault-injection script here still expects from it, and only fall
        # back to whatever APP_KIND/APP_NAMESPACE/APP_LABEL already say if TARGETS
        # isn't set (e.g. a future/different operator version that does populate
        # them directly).
        if [ -n "${TARGETS:-}" ]; then
          APP_NAMESPACE=$(echo "$TARGETS" | cut -d: -f2)
          APP_LABEL=$(echo "$TARGETS" | cut -d: -f3 | tr -d '[]')
        fi
        # ChaosEngine.spec.appinfo.appkind is CRD-validated to a fixed enum
        # (deployment|statefulset|daemonset|deploymentconfig|rollout|job) --
        # "configmap" is rejected outright at admission time. This fault always
        # targets a configmap, never any other kind, so hardcode it here instead
        # of trusting TARGETS' kind component (the ChaosEngine submission uses
        # a dummy CRD-valid appkind like "deployment" purely to satisfy the
        # schema; only appns/applabel need to vary per submission).
        APP_KIND="configmap"
        echo "Resolving target ${APP_KIND}/flagd-config in ns=${APP_NAMESPACE}"
        CURRENT=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" flagd-config -o jsonpath='{.data.demo\.flagd\.json}')
        if [ -z "$CURRENT" ]; then
          echo "ConfigMap flagd-config has no 'demo.flagd.json' data key" >&2
          exit 1
        fi

        if ! printf '%s\n' "$CURRENT" | grep -q "\"${FLAG_NAME}\"[[:space:]]*:[[:space:]]*{"; then
          echo "flag '${FLAG_NAME}' not found in demo.flagd.json flags map" >&2
          exit 1
        fi

        # Prints the current defaultVariant of the named flag's JSON object
        # (empty if the flag has no defaultVariant field).
        extract_variant() {
          awk -v flag="$1" '
            BEGIN { in_block=0; depth=0; found=0 }
            {
              line = $0
              if (!in_block) {
                if (match(line, "\"" flag "\"[[:space:]]*:[[:space:]]*\\{")) { in_block=1; depth=1; next }
              } else {
                if (depth == 1 && found == 0 && match(line, /"defaultVariant"[[:space:]]*:[[:space:]]*"[^"]*"/)) {
                  val = line
                  sub(/^.*"defaultVariant"[[:space:]]*:[[:space:]]*"/, "", val)
                  sub(/".*$/, "", val)
                  print val
                  found = 1
                }
                opens = gsub(/\{/, "{", line); closes = gsub(/\}/, "}", line)
                depth += opens - closes
                if (depth <= 0) in_block = 0
              }
            }
          '
        }

        # Rewrites the named flag's defaultVariant in place; every other byte
        # of the JSON document (other flags, ordering, description, etc.) is
        # left untouched so the revert is byte-exact.
        patch_variant() {
          awk -v flag="$1" -v newval="$2" '
            BEGIN { in_block=0; depth=0; found=0 }
            {
              line = $0
              if (!in_block) {
                if (match(line, "\"" flag "\"[[:space:]]*:[[:space:]]*\\{")) { in_block=1; depth=1; print line; next }
              } else {
                if (depth == 1 && found == 0 && match(line, /"defaultVariant"[[:space:]]*:[[:space:]]*"[^"]*"/)) {
                  sub(/"defaultVariant"[[:space:]]*:[[:space:]]*"[^"]*"/, "\"defaultVariant\": \"" newval "\"", line)
                  found = 1
                }
                opens = gsub(/\{/, "{", line); closes = gsub(/\}/, "}", line)
                depth += opens - closes
                if (depth <= 0) in_block = 0
              }
              print line
            }
          '
        }

        apply_configmap() {
          # $1 = full new demo.flagd.json content; JSON-escape it and merge-patch
          # it back into the single opaque data key (no jq/python in this image).
          ESCAPED=$(printf '%s\n' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | awk '{printf "%s\\n", $0}')
          kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" flagd-config --type=merge \
            -p "{\"data\":{\"demo.flagd.json\":\"${ESCAPED}\"}}"
        }

        ORIG_VARIANT=$(printf '%s\n' "$CURRENT" | extract_variant "${FLAG_NAME}")
        ORIG_VARIANT="${ORIG_VARIANT:-${FLAG_REVERT_STATE}}"
        echo "flag=${FLAG_NAME} originalDefaultVariant=${ORIG_VARIANT}"

        echo "Injecting: setting ${FLAG_NAME}.defaultVariant=${FLAG_STATE}"
        INJECTED=$(printf '%s\n' "$CURRENT" | patch_variant "${FLAG_NAME}" "${FLAG_STATE}")
        apply_configmap "$INJECTED"

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
        sleep "${TOTAL_CHAOS_DURATION}"

        echo "Reverting: restoring ${FLAG_NAME}.defaultVariant=${ORIG_VARIANT}"
        REVERTED=$(printf '%s\n' "$INJECTED" | patch_variant "${FLAG_NAME}" "${ORIG_VARIANT}")
        apply_configmap "$REVERTED"
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo. This
      # fault targets the flagd-config ConfigMap by a fixed name, not by
      # label, so APP_LABEL is declared for interface consistency with other
      # first-class faults but is not used by the script.
      - name: APP_NAMESPACE
        value: "otel-demo"
      - name: APP_LABEL
        value: ""
      - name: APP_KIND
        value: "configmap"

      # name of the feature flag to toggle, matching a key under
      # flagd-config's demo.flagd.json ".flags" map (e.g. loadGeneratorFloodHomepage,
      # adHighCpu, productCatalogFailure, ...)
      - name: FLAG_NAME
        value: "loadGeneratorFloodHomepage"

      # value written to the flag's "defaultVariant" field during injection
      - name: FLAG_STATE
        value: "on"

      # fallback revert value used only if the flag's original defaultVariant
      # could not be captured before injection; normally the captured
      # original value is used so the revert is exact
      - name: FLAG_REVERT_STATE
        value: "off"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: opentelemetry-demo-feature-flag
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
---
---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Injects an additional initContainer that runs a deliberately bad script
    into a Deployment/StatefulSet's pod template, so the pod becomes stuck in
    Init:CrashLoopBackOff and the main container never starts, then reverts
    by removing only the injected initContainer. Mirrors ITBench SRE
    scenario "crashing-kubernetes-workload-init-container" (fault library
    index 2).
kind: ChaosExperiment
metadata:
  name: crashing-kubernetes-workload-init-container
  labels:
    name: crashing-kubernetes-workload-init-container
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "litmuschaos/k8s:latest"
    imagePullPolicy: Always
    command:
      - /bin/sh
    args:
      - -c
      - |
        set -eu
        # The chaos-operator on this cluster declares APP_NAMESPACE/APP_LABEL/APP_KIND
        # as env var names but never populates their values from
        # ChaosEngine.spec.appinfo -- verified empirically (a real ChaosEngine
        # submission mistargeted an unrelated deployment because both vars were
        # empty). This operator version instead sets a single combined TARGETS var,
        # format "<kind>:<namespace>:[<label-selector>]:<mode>". Derive the vars
        # every fault-injection script here still expects from it, and only fall
        # back to whatever APP_KIND/APP_NAMESPACE/APP_LABEL already say if TARGETS
        # isn't set (e.g. a future/different operator version that does populate
        # them directly).
        if [ -n "${TARGETS:-}" ]; then
          APP_KIND=$(echo "$TARGETS" | cut -d: -f1)
          APP_NAMESPACE=$(echo "$TARGETS" | cut -d: -f2)
          APP_LABEL=$(echo "$TARGETS" | cut -d: -f3 | tr -d '[]')
        fi
        echo "Resolving target ${APP_KIND} in ns=${APP_NAMESPACE} label=${APP_LABEL}"
        TARGET=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" -o jsonpath='{.items[0].metadata.name}')
        if [ -z "$TARGET" ]; then
          echo "no ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
          exit 1
        fi
        echo "Target=${TARGET}"

        # Capture how many initContainers already exist (0 means the field is
        # absent/empty). Strategic-merge-patch merges initContainers by name
        # (patchMergeKey=name, same additive convention used for volumeMounts
        # in the nonexistent-pvc fault) and appends unmatched new entries to
        # the end of the list, so this count also doubles as the index our
        # injected initContainer will land at once appended.
        ORIG_INIT_COUNT=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" \
          -o jsonpath='{range .spec.template.spec.initContainers[*]}{.name}{"\n"}{end}' | (grep -c . || true))
        echo "Target=${TARGET} existingInitContainers=${ORIG_INIT_COUNT}"

        echo "Injecting: adding crashing initContainer '${INIT_CONTAINER_NAME}' (image=${INIT_CONTAINER_IMAGE})"
        kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=strategic \
          -p "{\"spec\":{\"template\":{\"spec\":{\"initContainers\":[{\"name\":\"${INIT_CONTAINER_NAME}\",\"image\":\"${INIT_CONTAINER_IMAGE}\",\"command\":[\"/bin/sh\",\"-c\",\"${BAD_SCRIPT}\"]}]}}}}"

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
        sleep "${TOTAL_CHAOS_DURATION}"

        # Revert: strategic-merge-patch cannot delete a single item out of a
        # keyed list (it can only add/merge entries), so unlike a scalar
        # field (e.g. readinessProbe, where reverting to "no probe" is a
        # simple null substitution) we must either null out the whole list
        # (safe only if it was empty beforehand) or JSON-patch-remove just
        # the one index we injected, leaving any pre-existing initContainers
        # untouched.
        if [ "${ORIG_INIT_COUNT}" -eq 0 ]; then
          echo "Reverting: no initContainers existed originally, clearing the whole initContainers field"
          kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=strategic \
            -p '{"spec":{"template":{"spec":{"initContainers":null}}}}'
        else
          echo "Reverting: removing only the injected initContainer at index ${ORIG_INIT_COUNT}"
          kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=json \
            -p "[{\"op\":\"remove\",\"path\":\"/spec/template/spec/initContainers/${ORIG_INIT_COUNT}\"}]"
        fi
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo
      - name: APP_NAMESPACE
        value: "otel-demo"
      - name: APP_LABEL
        value: "opentelemetry.io/name=recommendation"
      - name: APP_KIND
        value: "deployment"

      # distinctive name for the injected initContainer so revert can find it
      - name: INIT_CONTAINER_NAME
        value: "chaos-crashing-init"

      # small image used to run the bad script
      - name: INIT_CONTAINER_IMAGE
        value: "busybox:1.36"

      # the "bad script" that always fails, forcing Init:CrashLoopBackOff
      - name: BAD_SCRIPT
        value: "echo 'chaos: executing malformed startup script'; exit 1"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: crashing-kubernetes-workload-init-container
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
---
---
apiVersion: litmuschaos.io/v1alpha1
description:
  message: |
    Creates or patches a namespace-scoped ResourceQuota with hard cpu/memory
    limits far too low for the target workload to (re)schedule, then restores
    the quota's original spec (or deletes it entirely if it did not exist
    before injection). A rollout restart of the target Deployment/StatefulSet
    is used to force new pod admission attempts against the tightened quota.
    Mirrors ITBench SRE scenario "insufficient-kubernetes-resource-quota"
    (fault library index 7), as used in ITBench scenarios 52 (otel-demo
    "checkout") and 102 (otel-demo "ad").
kind: ChaosExperiment
metadata:
  name: insufficient-kubernetes-resource-quota
  labels:
    name: insufficient-kubernetes-resource-quota
    app.kubernetes.io/part-of: litmus
    app.kubernetes.io/component: chaosexperiment
    app.kubernetes.io/version: ci
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods", "events"]
        verbs: ["create", "get", "list", "patch", "update"]
      - apiGroups: [""]
        resources: ["resourcequotas"]
        verbs: ["get", "list", "create", "patch", "update", "delete"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets"]
        verbs: ["get", "list", "patch", "update"]
      - apiGroups: ["litmuschaos.io"]
        resources: ["chaosengines", "chaosexperiments", "chaosresults"]
        verbs: ["create", "list", "get", "patch", "update", "delete"]
    image: "litmuschaos/k8s:latest"
    imagePullPolicy: Always
    command:
      - /bin/sh
    args:
      - -c
      - |
        set -eu
        # The chaos-operator on this cluster declares APP_NAMESPACE/APP_LABEL/APP_KIND
        # as env var names but never populates their values from
        # ChaosEngine.spec.appinfo -- verified empirically (a real ChaosEngine
        # submission mistargeted an unrelated deployment because both vars were
        # empty). This operator version instead sets a single combined TARGETS var,
        # format "<kind>:<namespace>:[<label-selector>]:<mode>". Derive the vars
        # every fault-injection script here still expects from it, and only fall
        # back to whatever APP_KIND/APP_NAMESPACE/APP_LABEL already say if TARGETS
        # isn't set (e.g. a future/different operator version that does populate
        # them directly).
        if [ -n "${TARGETS:-}" ]; then
          APP_KIND=$(echo "$TARGETS" | cut -d: -f1)
          APP_NAMESPACE=$(echo "$TARGETS" | cut -d: -f2)
          APP_LABEL=$(echo "$TARGETS" | cut -d: -f3 | tr -d '[]')
        fi
        echo "Resolving target ${APP_KIND} in ns=${APP_NAMESPACE} label=${APP_LABEL}"
        TARGET=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" -l "${APP_LABEL}" -o jsonpath='{.items[0].metadata.name}')
        if [ -z "$TARGET" ]; then
          echo "no ${APP_KIND} found matching label ${APP_LABEL} in ${APP_NAMESPACE}" >&2
          exit 1
        fi
        echo "Target=${TARGET} (fault is namespace-scoped: ${QUOTA_NAME} quota applies to all workloads in ${APP_NAMESPACE})"

        # Capture whether the ResourceQuota already existed, and if so, the
        # original value of each of the four hard keys we are about to
        # tighten (empty means that particular key was not set originally).
        if kubectl get resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" >/dev/null 2>&1; then
          EXISTED="true"
          ORIG_REQ_CPU=$(kubectl get resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" -o jsonpath='{.spec.hard.requests\.cpu}')
          ORIG_REQ_MEM=$(kubectl get resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" -o jsonpath='{.spec.hard.requests\.memory}')
          ORIG_LIM_CPU=$(kubectl get resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" -o jsonpath='{.spec.hard.limits\.cpu}')
          ORIG_LIM_MEM=$(kubectl get resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" -o jsonpath='{.spec.hard.limits\.memory}')
          echo "ResourceQuota ${QUOTA_NAME} already exists; original hard: requests.cpu=${ORIG_REQ_CPU:-<unset>} requests.memory=${ORIG_REQ_MEM:-<unset>} limits.cpu=${ORIG_LIM_CPU:-<unset>} limits.memory=${ORIG_LIM_MEM:-<unset>}"
        else
          EXISTED="false"
          echo "ResourceQuota ${QUOTA_NAME} does not exist yet; it will be created now and deleted entirely on revert"
        fi

        echo "Injecting: setting ${QUOTA_NAME} hard limits to requests.cpu=${QUOTA_HARD_REQUESTS_CPU} requests.memory=${QUOTA_HARD_REQUESTS_MEMORY} limits.cpu=${QUOTA_HARD_LIMITS_CPU} limits.memory=${QUOTA_HARD_LIMITS_MEMORY}"
        if [ "$EXISTED" = "true" ]; then
          kubectl patch resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" --type=merge -p \
            "{\"spec\":{\"hard\":{\"requests.cpu\":\"${QUOTA_HARD_REQUESTS_CPU}\",\"requests.memory\":\"${QUOTA_HARD_REQUESTS_MEMORY}\",\"limits.cpu\":\"${QUOTA_HARD_LIMITS_CPU}\",\"limits.memory\":\"${QUOTA_HARD_LIMITS_MEMORY}\"}}}"
        else
          kubectl create resourcequota "${QUOTA_NAME}" -n "${APP_NAMESPACE}" \
            --hard="requests.cpu=${QUOTA_HARD_REQUESTS_CPU},requests.memory=${QUOTA_HARD_REQUESTS_MEMORY},limits.cpu=${QUOTA_HARD_LIMITS_CPU},limits.memory=${QUOTA_HARD_LIMITS_MEMORY}"
        fi

        echo "Triggering new pod admission attempts: rollout restart ${APP_KIND}/${TARGET}"
        kubectl rollout restart -n "${APP_NAMESPACE}" "${APP_KIND}/${TARGET}"

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
        sleep "${TOTAL_CHAOS_DURATION}"

        echo "Reverting ResourceQuota ${QUOTA_NAME}"
        if [ "$EXISTED" = "true" ]; then
          REQ_CPU_JSON="null"; [ -n "$ORIG_REQ_CPU" ] && REQ_CPU_JSON="\"${ORIG_REQ_CPU}\""
          REQ_MEM_JSON="null"; [ -n "$ORIG_REQ_MEM" ] && REQ_MEM_JSON="\"${ORIG_REQ_MEM}\""
          LIM_CPU_JSON="null"; [ -n "$ORIG_LIM_CPU" ] && LIM_CPU_JSON="\"${ORIG_LIM_CPU}\""
          LIM_MEM_JSON="null"; [ -n "$ORIG_LIM_MEM" ] && LIM_MEM_JSON="\"${ORIG_LIM_MEM}\""
          echo "Restoring original hard limits (null means the key did not exist before injection and is removed)"
          kubectl patch resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" --type=merge -p \
            "{\"spec\":{\"hard\":{\"requests.cpu\":${REQ_CPU_JSON},\"requests.memory\":${REQ_MEM_JSON},\"limits.cpu\":${LIM_CPU_JSON},\"limits.memory\":${LIM_MEM_JSON}}}}"
        else
          echo "Deleting ${QUOTA_NAME} (did not exist before injection)"
          kubectl delete resourcequota -n "${APP_NAMESPACE}" "${QUOTA_NAME}" --ignore-not-found
        fi
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo
      - name: APP_NAMESPACE
        value: ""
      - name: APP_LABEL
        value: ""
      - name: APP_KIND
        value: "deployment"

      # name of the ResourceQuota object to create/patch; matches ITBench's
      # own fixture ("kubectl -n otel-demo edit/delete resourcequota memory")
      - name: QUOTA_NAME
        value: "memory"

      # underprovisioned hard limits — deliberately far below any real
      # container's typical requests/limits so new pod admission always fails
      - name: QUOTA_HARD_REQUESTS_CPU
        value: "10m"
