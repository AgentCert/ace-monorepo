        ORIG_METRICS=$(kubectl get "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" -o jsonpath='{.spec.metrics}')
        echo "Original metrics: ${ORIG_METRICS:-<none>}"

        MISCONFIGURED_METRICS="[{\"type\":\"Resource\",\"resource\":{\"name\":\"cpu\",\"target\":{\"type\":\"Utilization\",\"averageUtilization\":${CPU_UTILIZATION_PERCENT}}}},{\"type\":\"Resource\",\"resource\":{\"name\":\"memory\",\"target\":{\"type\":\"Utilization\",\"averageUtilization\":${MEMORY_UTILIZATION_PERCENT}}}}]"

        echo "Injecting: forcing HPA ${TARGET} to target unrealistically low CPU (${CPU_UTILIZATION_PERCENT}%) / memory (${MEMORY_UTILIZATION_PERCENT}%) utilization"
        kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=merge \
          -p "{\"spec\":{\"metrics\":${MISCONFIGURED_METRICS}}}"

        echo "Holding fault for ${TOTAL_CHAOS_DURATION}s"
        sleep "${TOTAL_CHAOS_DURATION}"

        # Revert: null removes the field (merge-patch semantics) if none
        # existed originally; otherwise restore the captured metrics array.
        if [ -z "$ORIG_METRICS" ]; then
          METRICS_JSON="null"
        else
          METRICS_JSON="$ORIG_METRICS"
        fi
        echo "Reverting HPA ${TARGET} utilization targets to original"
        kubectl patch "${APP_KIND}" -n "${APP_NAMESPACE}" "$TARGET" --type=merge \
          -p "{\"spec\":{\"metrics\":${METRICS_JSON}}}"
    env:
      # Injected by the chaos-operator from ChaosEngine.spec.appinfo
      - name: APP_NAMESPACE
        value: ""
      - name: APP_LABEL
        value: ""
      - name: APP_KIND
        value: "horizontalpodautoscaler"

      # misconfigured utilization targets, matching ITBench's own fixture
      # values (see ITBench molecule test for this fault: cpu -> 20, mem -> 30)
      - name: CPU_UTILIZATION_PERCENT
        value: "20"
      - name: MEMORY_UTILIZATION_PERCENT
        value: "30"

      - name: TOTAL_CHAOS_DURATION
        value: "300"

    labels:
      name: misconfigured-kubernetes-horizontal-pod-autoscaler
      app.kubernetes.io/part-of: litmus
      app.kubernetes.io/component: experiment-job
      app.kubernetes.io/version: ci
