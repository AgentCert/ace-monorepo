# ACE bench config for generic-agent.
# Used by: scripts/ace-bench.py generic-agent
#
# Paths are relative to the ace-monorepo root unless they start with /.

# --- Identity ---
agent_id: generic-agent-v1
agent_name: Generic Agent (MCP + LiteLLM)

# --- Pipeline type ---
# trace_based: LitmusChaos fault injection -> agent scan -> Langfuse traces
#              -> Phase 0+1 per fault -> Phase 2+3+4 across all faults
pipeline: trace_based

# --- Agent env ---
# Key=value file with at least OPENAI_API_KEY, OPENAI_BASE_URL, MODEL_ALIAS.
env_file: .tmp/generic-agent-trial/generic-agent.env

# --- Trace-based-specific ---
trace_based:
  # Directory containing ChaosEngine YAMLs named engine-<fault>.yaml.
  engines_dir: .tmp/mass-execution

  langfuse_base_url: http://127.0.0.1:4001

  # MCP endpoints injected into scenario_data.json.
  mcp_urls: "http://localhost:31086/mcp,http://localhost:31085/mcp"

  scan_query: >-
    Analyse Kubernetes cluster health and report all detected issues,
    including their probable root causes and recommended remediation.

  agent_timeout_s: 600

  # Seconds to wait after applying the ChaosEngine before starting the agent,
  # so the fault is actually live when the agent looks.
  fault_settle_s: 15

  repeat_per_fault: 5

# --- Certifier ---
certifier:
  venv: .venv-certifier
  runs_per_fault: 5
