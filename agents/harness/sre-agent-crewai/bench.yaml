agent_id: sre-agent-crewai-v1
agent_name: SRE Incident Diagnosis Agent (CrewAI/Qwen)
# Pipeline: itbench_sre has been retired from ace-bench.py.
# sre-agent-crewai is now orchestrated exclusively via the LitmusChaos Argo
# Workflow. To run a benchmark: register sre-agent-crewai in AgentCert (Steps
# 2a-2d of the migration plan) and trigger the workflow from the AgentCert UI.
pipeline: litmus  # placeholder — ace-bench.py no longer drives this agent

env_file: .tmp/sre-agent-qwen-trial/sre-agent-qwen.env

itbench_sre:
  faults_dirs:
    - chaos-charts/faults/itbench
    - chaos-charts/faults/kubernetes
  engines_dir: .tmp/mass-execution
  model: qwen2.5-7b-instruct
  prompt_file: sre_react_online_base.md
  fault_settle_s: 15
  per_scenario_timeout_s: 900
  runs_per_fault: 30

certifier:
  venv: .venv-certifier
  runs_per_fault: 30
