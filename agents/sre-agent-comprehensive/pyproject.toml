[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-agent-comprehensive"
version = "0.1.0"
description = "Comprehensive CrewAI SRE agent covering all chaos-charts fault categories"
requires-python = ">=3.12"
dependencies = [
    "crewai==0.95.0",
    "mcp>=1.9.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sre_comprehensive"]
