[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-agent-crewai"
version = "0.1.0"
description = "CrewAI-based SRE incident investigator for ACE benchmarking"
requires-python = ">=3.12"
dependencies = [
    "crewai==0.95.0",
    "mcp>=1.9.0",
    "httpx>=0.27.0",
    "litellm>=1.49.4",
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sre_crewai"]
