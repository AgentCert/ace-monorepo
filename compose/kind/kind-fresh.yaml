kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Label so an ingress controller can schedule here (ingress-nginx kind preset)
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
            # Host's docker data-root (/Innovation/docker) sits on a large but
            # nearly-full volume. Kubelet's default eviction-hard thresholds
            # (nodefs.available<10%, imagefs.available<15%) trip on percentage
            # alone even when tens of GB are free in absolute terms. Override
            # with absolute floors instead.
            eviction-hard: "nodefs.available<5Gi,imagefs.available<5Gi,nodefs.inodesFree<5%,imagefs.inodesFree<5%"
    extraPortMappings:
      # ingress (host 8080 -> node 80), matching the old cluster
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # Prometheus NodePort (sock-shop monitoring)
      - containerPort: 31090
        hostPort: 31090
        protocol: TCP
      # Grafana NodePort (sock-shop monitoring)
      - containerPort: 31687
        hostPort: 31687
        protocol: TCP
      # dex NodePort (auth OIDC)
      - containerPort: 32000
        hostPort: 32000
        protocol: TCP
