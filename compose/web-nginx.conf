# =============================================================================
# nginx config for the AgentCert web container under docker-compose.
#
# The baked-in image config proxies to Kubernetes service names
# (litmusportal-*-service:900x). Under compose, web/auth/graphql all run on
# the default bridge network (not network_mode: host — see docker-compose.yml
# for why: rootless Docker's "host" networking isn't the real host, so
# reachability needs explicit ports: instead), so we proxy to auth/graphql by
# their Docker Compose service names instead of localhost. Mounted over
# /etc/nginx/nginx.conf at runtime.
#
# Internal listen port is fixed at 2001 regardless of WEB_PORT — WEB_PORT only
# varies the HOST-side publish in docker-compose.yml's `ports:` mapping (same
# pattern as mongo/ollama). Served over plain HTTP — the dev server's
# self-signed HTTPS on 2001 is not reproduced in the prod image.
# =============================================================================
pid /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_disable "msie6";

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 2001 default_server;
        root   /opt/chaos;

        location /health {
          return 200;
        }

        location / {
            proxy_http_version 1.1;
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
            autoindex on;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        # Auth service (REST) — compose `auth` service, reached by Docker DNS.
        # Container-internal port (auth's own REST_PORT, default 3000) — not
        # AUTH_REST_PORT's host-side publish, a separate concern.
        location /auth/ {
            proxy_http_version 1.1;
            proxy_set_header   Host                 $host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
            proxy_pass "http://auth:3000/";
        }

        # GraphQL server (REST + WS) — compose `graphql` service, reached by
        # Docker DNS. Container-internal port (graphql's own REST_PORT,
        # default 8081) — not GQL_REST_PORT's host-side publish.
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header   Upgrade              $http_upgrade;
            proxy_set_header   Connection           $connection_upgrade;
            proxy_set_header   Host                 $host;
            proxy_set_header   X-Real-IP            $remote_addr;
            proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto    $scheme;
            proxy_pass "http://graphql:8081/";
        }
    }
}
