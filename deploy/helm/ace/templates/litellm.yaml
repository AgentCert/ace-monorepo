apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ include "ace.namespace" . }}
data:
  litellm_config.yaml: |
{{ .Values.litellm.config | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-data
  namespace: {{ include "ace.namespace" . }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.litellm }}
---
{{- /*
LLM Models registry: with a database LiteLLM stores the models projects add
from the UI (ACE's /llm-models page) and their keys, encrypted with
LITELLM_SALT_KEY. setup.sh sets both values; an empty one leaves the registry
off, never a DATABASE_URL pointing at nothing. LiteLLM creates its database on
first start. DATABASE_URL is set only here, never in ace-env: Langfuse reads
that name too.
*/}}
{{- $modelRegistry := and .Values.env.LITELLM_DATABASE_URL .Values.env.LITELLM_SALT_KEY }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: {{ include "ace.namespace" . }}
spec:
  replicas: 1
  {{- if .Values.storage.cloudDisks }}
  # ReadWriteOnce cloud disk: it attaches to one node at a time, so stop the
  # old pod before starting the new one (RollingUpdate can deadlock on
  # Multi-Attach when the new pod lands on another node).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        checksum/config: {{ .Values.litellm.config | sha256sum }}
    spec:
      {{- include "ace.imagePullSecrets" $ | nindent 6 }}
      {{- if $modelRegistry }}
      initContainers:
        # LiteLLM connects to its database once, at startup: started before
        # Postgres is ready, it would serve without the registry until its next
        # restart. pg_isready only needs the server up, not the database.
        - name: wait-for-db
          image: {{ include "ace.image" (dict "root" $ "image" .Values.images.postgres "local" false) }}
          imagePullPolicy: {{ .Values.infraImagePullPolicy }}
          command:
            - sh
            - -c
            - |
              until pg_isready -q -d "$LITELLM_DATABASE_URL" -t 3; do
                echo "waiting for the LiteLLM database server to accept connections..."
                sleep 2
              done
          env:
            - name: LITELLM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LITELLM_DATABASE_URL
      {{- end }}
      containers:
        - name: litellm
          image: {{ include "ace.image" (dict "root" $ "image" .Values.images.litellm "local" false) }}
          imagePullPolicy: {{ .Values.infraImagePullPolicy }}
          # No --detailed_debug: at debug level LiteLLM logs every model's
          # plaintext API key on every request.
          args: [--config, /app/config.yaml, --port, "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          env:
            - name: LANGFUSE_HOST
              value: "http://langfuse-web:3000"
            # LiteLLM's shared aiohttp session (added in v1.82, "prevents cold
            # starts") pools connections for the proxy's whole lifetime,
            # default keepalive 120s. If a backend (e.g. Azure) closes an idle
            # connection server-side sooner than that, the client hands it
            # back out anyway on the next request and gets a bare
            # litellm.APIConnectionError -- observed directly against this
            # deployment (root-caused via /app/litellm/proxy/route_llm_request.py
            # and constants.py in the deployed litellm/litellm:v1.82.0-stable
            # image). aiohttp's TCPConnector has no "verify still alive before
            # reuse" option, only this static timeout, so the fix is keeping
            # it comfortably below whatever the flakiest backend's own idle
            # timeout is rather than relying on the 120s default.
            - name: AIOHTTP_KEEPALIVE_TIMEOUT
              value: "45"
            {{- if $modelRegistry }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LITELLM_DATABASE_URL
            - name: STORE_MODEL_IN_DB
              value: "True"
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: litellm_config.yaml
              readOnly: true
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: data
          persistentVolumeClaim:
            claimName: litellm-data
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ include "ace.namespace" . }}
spec:
  selector:
    app: litellm
  type: NodePort
  ports:
    - port: 14000
      targetPort: 4000
      nodePort: 31400
