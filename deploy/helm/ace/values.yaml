# =============================================================================
# ACE Helm chart — default values
#
# Credentials (env vars) are passed via -f values-env.yaml, generated from
# the root .env by scripts/setup.sh. Never edit values-env.yaml by hand —
# re-run setup.sh to regenerate it.
# =============================================================================

secretName: ace-env

# ── Per-service overrides ─────────────────────────────────────────────────────
# The web service is the only external entry point — nginx inside it proxies /api/
# and /auth/ to graphql and auth by K8s service DNS. setup.sh sets web.serviceType
# to LoadBalancer for cloud (AKS/EKS/GKE) deployments.
web:
  serviceType: NodePort

# graphql is internal-only (reached via the web nginx proxy); always NodePort.

# ── Certifier: host-bridged report export (local KinD only) ──────────────────
# Mounts a hostPath volume into the certifier pod so finished HTML/PDF reports
# are also copied to a directory bridged out to the real host via
# deploy/kind/kind-agentcert.yaml's extraMounts (see CLAUDE.md §4.1/§6).
# Only meaningful for a KinD cluster this repo's own setup.sh created --
# setup.sh sets this to false for CLUSTER_MODE=cloud/local (existing/external
# kubeconfig with no such host bridge; deploy/k8s/certifier.yaml, the flat
# kubectl-apply alternative, does not support this feature at all).
certHostExport:
  enabled: true
  # Must match deploy/kind/kind-agentcert.yaml's extraMounts containerPath.
  nodeHostPath: /opt/cert-report-export

# ── Environment variables (populated from .env by setup.sh) ──────────────────
# scripts/setup.sh generates deploy/helm/ace/values-env.yaml with every
# KEY: "value" from .env under this key, then passes -f values-env.yaml.
env: {}

# ── Images ────────────────────────────────────────────────────────────────────
images:
  graphql:        agentcert/agentcert-graphql:latest
  auth:           agentcert/agentcert-auth:latest
  web:            agentcert/agentcert-web:latest
  certifier:      agentcert/certifier:latest
  litellm:        litellm/litellm:v1.82.0-stable
  mongodb:        mongo:5
  postgres:       postgres:17
  redis:          redis:7
  # Pin ClickHouse — the untagged image resolved to :latest and rolled onto 26.8.x, whose
  # changed integer toDateTime64() semantics (JSON/Values paths now read a bare number as
  # seconds, not ticks) made Langfuse v3's millisecond-epoch inserts overflow and saturate
  # every trace/observation timestamp to 9999-12-31 — traces then vanished from the UI and
  # the certifier (HANDOFF §108). We stay on 26.8 (matches the volume already written on
  # existing clusters, so no PVC wipe) and restore the pre-26.8 parse via the
  # clickhouse-ace-settings ConfigMap (templates/langfuse.yaml), which needs CH >= 26.8 —
  # keep this pin >= 26.8 or revisit that ConfigMap. setup.sh warns if :26.8 drifts again.
  clickhouse:     clickhouse/clickhouse-server:26.8
  minio:          cgr.dev/chainguard/minio
  langfuseWeb:    langfuse/langfuse:3
  langfuseWorker: langfuse/langfuse-worker:3
  busybox:        busybox:1.36
  metricsServer:  registry.k8s.io/metrics-server/metrics-server:v0.7.2

# ── metrics-server (cluster singleton) ──────────────────────────────────
# Owned by the platform rather than by any application chart, because its
# APIService/ClusterRole/ClusterRoleBinding are cluster-scoped: shipping them
# per-app made two concurrently installed apps fight over the same objects, and
# made uninstalling one app break metrics for the others. Worse, an APIService
# stuck Available=False blocks namespace finalization cluster-wide, so a broken
# metrics-server manifests as unrelated "namespace is Terminating" install
# failures. See templates/metrics-server.yaml.
#
# Set enabled=false only when the target cluster already provides its own
# metrics-server (k3s and most managed clusters do). It runs in the platform's
# own namespace by default; `namespace` is an override for clusters that
# require aggregated-API backends to live somewhere specific.
metricsServer:
  enabled: true
  namespace: ""

# IfNotPresent for KinD dev (images are kind-loaded locally); use Always for
# cloud/registry deployments where agentcert/* images are pulled from Docker Hub.
imagePullPolicy: IfNotPresent
infraImagePullPolicy: IfNotPresent

# ── Immutable local hub content ───────────────────────────────────────────────
# scripts/prepare-images.sh builds this image from the checked-out app-charts,
# agent-charts, and chaos-charts trees, then side-loads it into Kind/k3s before
# Helm starts GraphQL. Runtime pods never clone GitHub and the catalog files
# cannot drift from the chart/fault content that workflows execute.
chartsHub:
  bundleImage: agentcert/ace-hub-bundle:local
  # setup.sh overrides this to Never after side-loading in local mode. Registry
  # deployments may keep IfNotPresent and override bundleImage.
  bundleImagePullPolicy: IfNotPresent

# ── Persistent storage sizes ─────────────────────────────────────────────────
storage:
  mongodb:                5Gi
  certifierWorkspace:     2Gi
  litellm:                1Gi
  langfusePostgres:       5Gi
  langfuseRedis:          1Gi
  langfuseClickhouse:     10Gi
  langfuseClickhouseLogs: 2Gi
  langfuseMinio:          10Gi

# ── LiteLLM config ────────────────────────────────────────────────────────────
# Leave empty here — setup.sh injects the real config via values-env.yaml.
litellm:
  config: |
    # placeholder — injected by scripts/setup.sh via values-env.yaml
    model_list: []
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
