# =============================================================================
# AgentCert GraphQL control plane
#   REST  → :8081   (host :8081 via NodePort 32081)
#   gRPC  → :8082   (host :8082 via NodePort 32082)
#
# Runs as the `graphql` ServiceAccount (cluster-admin, see 01-rbac.yaml).
# KUBECONFIG is intentionally unset so the Go client falls back to in-cluster
# config (pod ServiceAccount token) — no kubeconfig file needed.
#
# Hub content is copied from an image built from this checkout. Runtime
# operation does not require GitHub and cannot drift to another branch.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql
  namespace: ace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graphql
  template:
    metadata:
      labels:
        app: graphql
    spec:
      serviceAccountName: graphql
      initContainers:
        - name: load-local-hubs
          image: agentcert/ace-hub-bundle:local
          imagePullPolicy: Never
          command: [sh, -ec]
          args:
            - |
              rm -rf /repo/*
              cp -a /bundle/. /repo/
              test -f /repo/agent-charts/charts/agents.chartserviceversion.yaml
              test -f /repo/app-charts/charts/applications.chartserviceversion.yaml
              test -f "/repo/chaos-hubs/Litmus ChaosHub/faults/fault-capabilities.yaml"
          volumeMounts:
            - name: repo
              mountPath: /repo
      containers:
        - name: graphql
          image: agentcert/agentcert-graphql:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: ace-env
          env:
            # Per-service ports
            - name: REST_PORT
              value: "8081"
            - name: GRPC_PORT
              value: "8082"
            # MongoDB via cluster service
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ace-env
                  key: MONGODB_USERNAME
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ace-env
                  key: MONGODB_PASSWORD
                  optional: true
            - name: DB_SERVER
              value: "mongodb://$(DB_USER):$(DB_PASSWORD)@mongodb:27017/?replicaSet=rs0&authSource=admin"
            # Auth service is a K8s service in the same namespace, not localhost
            - name: LITMUS_AUTH_GRPC_ENDPOINT
              value: "auth"
            - name: LITMUS_AUTH_GRPC_PORT
              value: "3030"
            # In-cluster agents call back via the K8s service (not the host IP)
            - name: CHAOS_CENTER_UI_ENDPOINT
              value: "http://graphql.ace.svc.cluster.local:8081"
            # Optional human/kubectl-facing override (distinct from the in-cluster
            # CHAOS_CENTER_UI_ENDPOINT above) for the `kubectl apply -f <url>`
            # manifest-download link. Deliberately NOT hardcoded here: this
            # Deployment already gets every key from ace-env via envFrom below,
            # and a K8s env: entry with the same name always wins over envFrom —
            # so a hardcoded value here would silently shadow whatever a user set
            # in .env. Leave unset to fall back to request-based detection
            # (correct for most real clusters reached via LoadBalancer/Ingress);
            # set CHAOS_CENTER_PUBLIC_ENDPOINT in .env before regenerating the
            # ace-env secret only if that detection produces an address the
            # operator's own shell can't actually reach (see .env.example).
            # Allow WebSocket/HTTP connections from in-cluster pods; value set by scripts/setup.sh
            # in .env → ace-env secret. Edit ALLOWED_ORIGINS in .env to customise.
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: ace-env
                  key: ALLOWED_ORIGINS
                  optional: true
            # LiteLLM is a K8s service; the flash-agent reaches it by service name
            # Full cross-namespace DNS — flash-agent runs in sock-shop/litmus, not ace
            - name: OPENAI_BASE_URL
              value: "http://litellm.ace.svc.cluster.local:14000/v1"
            # Certifier endpoints (K8s service)
            - name: CERTIFIER_BASE_URL
              value: "http://certifier:8000"
            - name: CERTIFICATE_PDF_BASE_URL
              value: "http://certifier:8000"
            # Charts directories (available via the hostPath volume below)
            - name: DEFAULT_AGENT_HUB_PATH
              value: "/repo/agent-charts"
            - name: DEFAULT_APP_HUB_PATH
              value: "/repo/app-charts"
            - name: DEFAULT_CHAOS_HUB_PATH
              value: "/repo/chaos-hubs/"
            - name: AGENT_HUB_SOURCE_MODE
              value: "custom"
            - name: APP_HUB_SOURCE_MODE
              value: "custom"
            - name: HUB_SOURCE_MODE
              value: "custom"
            - name: FAULT_CAPABILITIES_PATH
              value: "/repo/chaos-hubs/Litmus ChaosHub/faults/fault-capabilities.yaml"
            # Do not attempt to re-read .env from the host filesystem
            - name: AGENTCERT_ENV_FILE
              value: ""
            # Use the host CA bundle for git-clone TLS inside the container
            - name: SSL_CERT_FILE
              value: "/etc/ssl/certs/ca-certificates.crt"
            # Map CHAOS_* → LITMUS_CHAOS_* (docker-compose did this mapping; K8s must do it explicitly)
            - name: LITMUS_CHAOS_OPERATOR_IMAGE
              valueFrom:
                secretKeyRef:
                  name: ace-env
                  key: CHAOS_OPERATOR_IMAGE
                  optional: true
            - name: LITMUS_CHAOS_RUNNER_IMAGE
              valueFrom:
                secretKeyRef:
                  name: ace-env
                  key: CHAOS_RUNNER_IMAGE
                  optional: true
            - name: LITMUS_CHAOS_EXPORTER_IMAGE
              valueFrom:
                secretKeyRef:
                  name: ace-env
                  key: CHAOS_EXPORTER_IMAGE
                  optional: true
          volumeMounts:
            # Repo bind-mount (kind node's extraMount makes this available)
            - name: repo
              mountPath: /repo
              readOnly: true
            - name: ca-certs
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      volumes:
        - name: repo
          emptyDir: {}
        - name: ca-certs
          configMap:
            name: ace-ca-certs
            items:
              - key: ca-certificates.crt
                path: ca-certificates.crt
---
apiVersion: v1
kind: Service
metadata:
  name: graphql
  namespace: ace
spec:
  selector:
    app: graphql
  type: NodePort
  ports:
    - name: rest
      port: 8081
      targetPort: 8081
      nodePort: 32081
    - name: grpc
      port: 8082
      targetPort: 8082
      nodePort: 32082
