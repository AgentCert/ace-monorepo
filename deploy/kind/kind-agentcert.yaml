kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: agentcert
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
            # Host's docker data-root (/Innovation/docker) sits on a large but
            # nearly-full volume (~2.6% free of 3.5T). Kubelet's default
            # eviction-hard thresholds (nodefs.available<10%, imagefs.available<15%)
            # trip on that percentage alone even though tens of GB are free in
            # absolute terms. Override with absolute floors instead.
            eviction-hard: "nodefs.available<5Gi,imagefs.available<5Gi,nodefs.inodesFree<5%,imagefs.inodesFree<5%"
    extraMounts:
      # Binds the node's local-path-provisioner backing directory to a host
      # path so PV data (MongoDB, certifier-workspace) survives `kind delete
      # cluster` + recreate. Without this, all PV data lives inside the KinD
      # control-plane node's own Docker container storage, which is destroyed
      # along with the node regardless of any PVC reclaimPolicy/keep
      # annotation -- those only protect against `helm uninstall` while the
      # cluster itself stays up. hostPath substituted by
      # render-kind-config.sh (KIND_HOST_DATA_DIR env var), instance-scoped
      # by ACE_INSTANCE_NAME so two checkouts never share PV data on this
      # shared host. See CLAUDE.md §6 "KinD Local Cluster".
      - hostPath: /__KIND_HOST_DATA_DIR__
        containerPath: /opt/local-path-provisioner
      # Separate, dedicated bridge (unrelated to local-path-provisioner above,
      # and unaffected by whatever state that one is in) so finished
      # certification reports are discoverable outside the cluster once the
      # certifier writes them — a plain hostPath volume on the certifier pod,
      # not a PVC, no StorageClass involved. hostPath substituted by
      # render-kind-config.sh (KIND_CERT_EXPORT_DIR env var), instance-scoped
      # by ACE_INSTANCE_NAME. See CLAUDE.md §4.1 "Workspace Layout".
      - hostPath: /__KIND_CERT_EXPORT_DIR__
        containerPath: /opt/cert-report-export
    extraPortMappings:
      # ingress
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
      # ── ACE application services ──────────────────────────────────────────
      # containerPort = NodePort value in the K8s Service manifest
      # hostPort      = port reachable from the host (browser / CLI)
      - containerPort: 32001
        hostPort: 2001    # AgentCert web UI
        protocol: TCP
      - containerPort: 32003
        hostPort: 3005    # auth REST (3000 occupied by a host/k3s process)
        protocol: TCP
      - containerPort: 32030
        hostPort: 3030    # auth gRPC
        protocol: TCP
      - containerPort: 32081
        hostPort: 8081    # graphql REST
        protocol: TCP
      - containerPort: 32082
        hostPort: 8082    # graphql gRPC
        protocol: TCP
      - containerPort: 32080
        hostPort: 18000   # certifier API
        protocol: TCP
      - containerPort: 31400
        hostPort: 14000   # LiteLLM proxy
        protocol: TCP
      - containerPort: 32400
        hostPort: 4002    # Langfuse UI/API (4000 occupied by agentlab-ui-angular on this host)
        protocol: TCP
      - containerPort: 32017
        hostPort: 27017   # MongoDB
        protocol: TCP
      - containerPort: 32090
        hostPort: 19090   # MinIO S3 API
        protocol: TCP
      # ── Target-app MCP servers (otel-demo namespace) ─────────────────────
      - containerPort: 31085
        hostPort: 31085   # otel-demo Prometheus MCP server
        protocol: TCP
      - containerPort: 31086
        hostPort: 31086   # otel-demo K8s MCP server
        protocol: TCP
      # ── Monitoring / OIDC ─────────────────────────────────────────────────
      - containerPort: 31090
        hostPort: 31090   # Prometheus
        protocol: TCP
      - containerPort: 31687
        hostPort: 31687   # Grafana
        protocol: TCP
      - containerPort: 32000
        hostPort: 32000   # dex OIDC
        protocol: TCP
