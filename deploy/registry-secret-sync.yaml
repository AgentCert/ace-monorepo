# registry-secret-sync — keeps the private-registry pull secret in every namespace.
#
# Installed by scripts/apply_cluster_prereqs.sh, only when IMAGE_REGISTRY is set
# (see docs/setup/registry-migration-plan.md, Phase 2). Not used on the
# open-source path.
#
# Why: experiments create namespaces at run time (sock-shop, book-info,
# otel-demo, itbench, agent namespaces, ...), long after setup ran. A pod in a
# namespace without the pull secret gets 401 from the registry. This copies the
# master secret from kube-system into each namespace and adds it to every
# ServiceAccount's imagePullSecrets, so pods there can pull.
#
#   * reacts to new namespaces and new ServiceAccounts within seconds (watches)
#   * re-checks everything every 60s (safety net, credential rotation)
#   * skips kube-system / kube-public / kube-node-lease, and any namespace
#     labelled ace.registry-sync=disabled
#   * never removes imagePullSecrets a ServiceAccount already has
#
# Placeholders filled in by apply_cluster_prereqs.sh before `kubectl apply`:
#   __IMAGE_PULL_SECRET_NAME__  the secret name (IMAGE_PULL_SECRET_NAME)
#   __SYNC_IMAGE__              kubectl image, resolved through IMAGE_REGISTRY
#                               (alpine/k8s, listed in deploy/images.txt)
#   __CONFIG_CHECKSUM__         checksum of the rendered manifest (rolls the pod
#                               only when something changed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: registry-secret-sync
  namespace: kube-system
  labels:
    app: registry-secret-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: registry-secret-sync
  labels:
    app: registry-secret-sync
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Read the master secret and create/update its copies. Kubernetes RBAC cannot
  # limit create by name, so this is cluster-wide.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: registry-secret-sync
  labels:
    app: registry-secret-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: registry-secret-sync
subjects:
  - kind: ServiceAccount
    name: registry-secret-sync
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-secret-sync
  namespace: kube-system
  labels:
    app: registry-secret-sync
data:
  sync.sh: |
    #!/bin/bash
    # Copy SECRET_NAME from kube-system into every namespace and attach it to
    # every ServiceAccount there. See the header of registry-secret-sync.yaml.
    # kubectl calls are the expensive part, so each step uses as few as possible:
    # one read of the master secret per pass, one list per namespace for
    # ServiceAccounts, and a write only when something is actually missing.
    set -u
    SRC_NS=kube-system
    SKIP=" kube-system kube-public kube-node-lease "
    MASTER=""   # base64 .dockerconfigjson of the master secret

    log() { echo "$(date -u +%H:%M:%S) $*"; }

    load_master() {
      MASTER="$(kubectl get secret "${SECRET_NAME}" -n "${SRC_NS}" -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null)"
      [[ -n "${MASTER}" ]] || log "master secret ${SRC_NS}/${SECRET_NAME} not found — nothing to copy"
      [[ -n "${MASTER}" ]]
    }

    # eligible NS PHASE OPTOUT -> 0 when the namespace should get the secret.
    eligible() {
      [[ "${SKIP}" != *" $1 "* && "$2" == Active && "$3" != disabled ]]
    }

    # Same check, looking the namespace up (for ServiceAccount events).
    ns_eligible() {
      local phase optout
      read -r phase optout < <(kubectl get namespace "$1" \
        -o jsonpath='{.status.phase} {.metadata.labels.ace\.registry-sync}' 2>/dev/null)
      eligible "$1" "${phase:-}" "${optout:-}"
    }

    # Make sure NS has an identical copy of the master secret.
    copy_secret() {
      local ns="$1" have cfg
      have="$(kubectl get secret "${SECRET_NAME}" -n "${ns}" -o jsonpath='{.data.\.dockerconfigjson}' 2>/dev/null)"
      [[ "${have}" == "${MASTER}" ]] && return 0
      cfg="$(mktemp)"
      printf '%s' "${MASTER}" | base64 -d > "${cfg}"
      kubectl create secret generic "${SECRET_NAME}" -n "${ns}" \
        --type=kubernetes.io/dockerconfigjson \
        --from-file=.dockerconfigjson="${cfg}" \
        --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1 \
        && log "copied ${SECRET_NAME} into ${ns}"
      rm -f "${cfg}"
    }

    # Add the secret to one ServiceAccount; HAVE = its current secret names
    # (space separated). Existing entries are kept.
    attach_sa() {
      local ns="$1" sa="$2" have="$3"
      [[ " ${have} " == *" ${SECRET_NAME} "* ]] && return 0
      if [[ -z "${have// /}" ]]; then
        kubectl patch serviceaccount "${sa}" -n "${ns}" --type merge \
          -p "{\"imagePullSecrets\":[{\"name\":\"${SECRET_NAME}\"}]}" >/dev/null 2>&1
      else
        kubectl patch serviceaccount "${sa}" -n "${ns}" --type json \
          -p "[{\"op\":\"add\",\"path\":\"/imagePullSecrets/-\",\"value\":{\"name\":\"${SECRET_NAME}\"}}]" >/dev/null 2>&1
      fi && log "attached ${SECRET_NAME} to ${ns}/${sa}"
    }

    # Secret + every ServiceAccount in one (eligible) namespace.
    sync_namespace() {
      local ns="$1" sa have
      copy_secret "${ns}"
      while IFS='=' read -r sa have; do
        [[ -n "${sa}" ]] && attach_sa "${ns}" "${sa}" "${have//,/ }"
      done < <(kubectl get serviceaccounts -n "${ns}" \
                 -o jsonpath='{range .items[*]}{.metadata.name}={range .imagePullSecrets[*]}{.name},{end}{"\n"}{end}' 2>/dev/null)
    }

    sync_all() {
      local ns phase optout
      load_master || return 0
      while read -r ns phase optout; do
        eligible "${ns}" "${phase}" "${optout:-}" && sync_namespace "${ns}"
      done < <(kubectl get namespaces \
                 -o jsonpath='{range .items[*]}{.metadata.name} {.status.phase} {.metadata.labels.ace\.registry-sync}{"\n"}{end}' 2>/dev/null)
    }

    # bash as PID 1 ignores SIGTERM by default; exit promptly when the pod stops.
    trap 'kill 0 2>/dev/null; exit 0' TERM INT
    log "registry-secret-sync started (secret: ${SECRET_NAME})"
    sync_all
    log "initial sync complete"

    # Safety net: full reconcile every 60s (also picks up credential rotation).
    ( while true; do sleep 60; sync_all; done ) &
    # New namespaces: sync as soon as they appear. Watches end when the API
    # server times them out, so each is restarted in a loop.
    ( while true; do
        kubectl get namespaces --watch-only \
            -o jsonpath='{.metadata.name} {.status.phase} {.metadata.labels.ace\.registry-sync}{"\n"}' 2>/dev/null \
          | while read -r ns phase optout; do
              eligible "${ns}" "${phase}" "${optout:-}" && load_master && sync_namespace "${ns}"
            done
        sleep 2
      done ) &
    # New ServiceAccounts (e.g. argo-chaos, flash-agent-sa): attach immediately,
    # so pods created right after the ServiceAccount already carry the secret.
    ( while true; do
        kubectl get serviceaccounts -A --watch-only \
            -o jsonpath='{.metadata.namespace} {.metadata.name} {range .imagePullSecrets[*]}{.name},{end}{"\n"}' 2>/dev/null \
          | while read -r ns sa have; do
              [[ -n "${sa}" ]] && ns_eligible "${ns}" || continue
              load_master && copy_secret "${ns}" && attach_sa "${ns}" "${sa}" "${have//,/ }"
            done
        sleep 2
      done ) &
    # If any loop dies, exit so Kubernetes restarts the pod.
    wait -n
    log "a sync loop exited — restarting"
    exit 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-secret-sync
  namespace: kube-system
  labels:
    app: registry-secret-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-secret-sync
  template:
    metadata:
      labels:
        app: registry-secret-sync
      annotations:
        # Changes whenever this manifest or the secret name changes, so
        # `kubectl apply` rolls the pod exactly when needed.
        ace.agentcert.io/config-checksum: "__CONFIG_CHECKSUM__"
    spec:
      serviceAccountName: registry-secret-sync
      # Its own image comes from the private registry too.
      imagePullSecrets:
        - name: __IMAGE_PULL_SECRET_NAME__
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: sync
          image: __SYNC_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/sync.sh"]
          env:
            - name: SECRET_NAME
              value: __IMAGE_PULL_SECRET_NAME__
            # kubectl caches discovery under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              # kubectl start-up is CPU-heavy; a tight limit made each call take seconds.
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: registry-secret-sync
        - name: tmp
          emptyDir: {}
