# =============================================================================
# ACE Monorepo — one-command bring-up
#
#   ./scripts/compose-up-guard.sh up -d
#
# On a shared host, prefer the guard script above over a raw `docker compose
# up -d` -- it's a drop-in wrapper that refuses to proceed if any container
# this file would create already exists under a DIFFERENT checkout's working
# directory (see CLAUDE.md section 0). The project name and every
# container_name below are suffixed with ACE_INSTANCE_NAME (.env) so two
# checkouts don't collide by default in the first place; the guard script is
# the belt-and-suspenders check for when they still might (e.g. shared
# ACE_INSTANCE_NAME, or unset on both).
#
# Replaces the old two-script flow (scripts/start-local-services.sh +
# scripts/azure_build/start-agentcert-v2.sh). Everything is driven by the
# monorepo-root .env — see the "Docker Compose one-command bring-up" block
# there for the switches: CLUSTER_MODE, LANGFUSE_MODE, LITELLM_MODE.
#
# Service map
#   cluster-init  one-shot: ensures a working Kubernetes context (auto/cloud/
#                 local/fresh) per CLUSTER_MODE; creates a kind cluster if none.
#   mongo         mongo:5 replSet rs0 + keyFile + auth (admin/1234).
#   auth          AgentCert authentication service   (REST :3000 / gRPC :3030)
#   graphql       AgentCert GraphQL control plane     (REST :8081 / gRPC :8082)
#   web           AgentCert UI (nginx)                (http://localhost:2001)
#   litellm       LiteLLM gateway  [profile: litellm] (http://localhost:14000)
#   app           Certifier API   (included)          (http://localhost:8000)
#   langfuse-*    Langfuse stack   [profile: langfuse](http://localhost:4000)
#
# Networking: mongo, auth, graphql, web, and app (certifier) all use bridge
# networking + explicit ports: (not network_mode: host) so they're reachable
# under both the shared root Docker daemon and a personal rootless one
# (./scripts/setup.sh --rootless-docker, CLAUDE.md §6) — rootless "host"
# networking is RootlessKit's own private netns, not the real host's, so
# explicit ports: is the one publishing form that actually forwards out.
# Service-to-service calls (web→auth/graphql, auth/graphql→mongo, graphql→
# certifier) use Docker Compose service-name DNS on the default network
# instead of the old 127.0.0.1/extra_hosts wiring that only worked when every
# container shared the real host loopback. graphql additionally joins the
# `kind` network to reach the KinD control-plane container directly (see the
# `networks:` block and cluster-init's KUBECONFIG_INTERNAL_OUT below) instead
# of via a host-published port. cluster-init alone stays network_mode: host —
# it needs the real docker.sock + ~/.kube either way, and KinD's node
# containers' host-published ports land in the same netns it occupies
# (RootlessKit's, under rootless) regardless. In-cluster pods still reach
# host-published services (litellm :14000, langfuse :4000) via the kind
# gateway 172.26.0.1, unaffected by any of the above.
# =============================================================================

# Suffixed with ACE_INSTANCE_NAME so this checkout's Compose project never
# collides with another checkout's on the same shared host -- Compose
# identifies "its" containers by this project label, not by working
# directory. "unconfigured" only applies if ACE_INSTANCE_NAME was never set
# (e.g. .env doesn't exist yet) -- run scripts/setup.sh first. See CLAUDE.md
# section 0 for the incident this guards against.
name: ace-${ACE_INSTANCE_NAME:-unconfigured}

# Pull in the certifier stack and the profile-gated Langfuse stack so a single
# `docker compose up` covers everything.
# NOTE: the certifier `app` service is defined inline below (not via `include`)
# so we can add its mongo dependency + Langfuse override without tripping the
# "services.app conflicts with imported resource" error on Docker Compose < 2.21.
include:
  - compose/langfuse/docker-compose.yml

services:

  # ── Kubernetes provisioner (runs first; everything k8s-dependent waits) ─────
  cluster-init:
    build: ./compose/cluster-init
    image: agentcert/cluster-init:latest
    container_name: ace-cluster-init-${ACE_INSTANCE_NAME:-unconfigured}
    network_mode: host
    environment:
      CLUSTER_MODE: ${CLUSTER_MODE:-auto}
      # Passed through empty-by-default on purpose: entrypoint.sh computes an
      # instance-scoped default (agentcert-${ACE_INSTANCE_NAME}) itself. A
      # bare "agentcert" baked in here would pre-empt that and put every
      # checkout back on the same host-wide-unique cluster name. See
      # CLAUDE.md section 0.
      ACE_INSTANCE_NAME: ${ACE_INSTANCE_NAME:-}
      KIND_CLUSTER_NAME: ${KIND_CLUSTER_NAME:-}
      # This checkout's host-side absolute path (Compose expands ${PWD} from
      # the invoking shell, i.e. wherever `docker compose up` was run from).
      # Used by entrypoint.sh only to label kind-cluster ownership so it can
      # tell "our cluster" apart from another checkout's on this same host.
      HOST_REPO_ROOT: ${PWD}
      HOST_PUBLIC_IP: ${HOST_PUBLIC_IP:-}
      KUBECONFIG: /host-kube/config
      KUBECONFIG_OUT: /shared/config
      # Additional "internal" kubeconfig (server: https://<cluster>-control-plane:6443,
      # a Docker-network container DNS name) for containers that are NOT
      # real-host-networked — currently just graphql, which runs on bridge
      # networking + explicit ports: so it's reachable under rootless Docker
      # (see CLAUDE.md §6). Written into the same `kubeconfig` volume cluster-init
      # already populates; only meaningful for actual local kind clusters.
      KUBECONFIG_INTERNAL_OUT: /shared/config-internal
      KIND_CONFIG: /repo/local-personal-workspace/kind-agentcert.yaml
      # Tells `kind create cluster` (invoked below via the bind-mounted docker.sock)
      # to attach its node containers to this pre-existing, checkout-scoped Compose
      # network instead of creating/reusing the docker-wide default "kind" network
      # every checkout on this host would otherwise share. Read directly by the
      # `kind` CLI's own environment — no entrypoint.sh change needed for this part.
      KIND_EXPERIMENTAL_DOCKER_NETWORK: kind-${ACE_INSTANCE_NAME:-unconfigured}
    volumes:
      # Defaults to the shared root daemon's socket. Under a personal rootless
      # daemon (./scripts/setup.sh --rootless-docker), that script writes
      # DOCKER_HOST_SOCK to .env pointing at the rootless socket instead — a
      # bind-mount source is a literal host path, not context-aware, so
      # without this override `kind create` below would silently keep talking
      # to the SHARED daemon even after `docker context use rootless`.
      - ${DOCKER_HOST_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      # Directory (not file) so a machine with no ~/.kube still works.
      - ${HOST_KUBE_DIR:-${HOME}/.kube}:/host-kube
      # World-readable kubeconfig copy for non-root app containers.
      - kubeconfig:/shared
      - .:/repo:ro
      # Cloud provider credential dirs — needed when the kubeconfig uses exec-auth
      # (AKS/EKS/GKE without static certs).  Each defaults to an empty named
      # volume so non-cloud hosts get no spurious root-owned dirs on disk.
      # Set the matching *_CONFIG_DIR var in .env to your real cred directory:
      #   AZURE_CONFIG_DIR=${HOME}/.azure   (AKS — az aks get-credentials)
      #   AWS_CONFIG_DIR=${HOME}/.aws       (EKS — aws eks update-kubeconfig)
      #   GCLOUD_CONFIG_DIR=${HOME}/.config/gcloud  (GKE — gcloud container clusters get-credentials)
      - ${AZURE_CONFIG_DIR:-empty-azure-creds}:/root/.azure:ro
      - ${AWS_CONFIG_DIR:-empty-aws-creds}:/root/.aws:ro
      - ${GCLOUD_CONFIG_DIR:-empty-gcloud-creds}:/root/.config/gcloud:ro
      # Mount the host /etc/hosts so pin_api_server_host() writes the private
      # cluster DNS→IP entry onto the host, for cluster-init's OWN kubectl calls
      # (this container stays network_mode: host, so it still shares the real/
      # RootlessKit host loopback either way). NOTE: graphql no longer shares
      # this file now that it runs on bridge networking (see KUBECONFIG_INTERNAL_OUT
      # above) — CLUSTER_MODE=cloud's privatelink-hostname RBAC preflight is a
      # known follow-up gap for graphql specifically, not yet fixed. See
      # innovation.md §3.19.
      - /etc/hosts:/etc/hosts
    restart: "no"

  # ── MongoDB (replSet rs0 + keyFile + root auth) ─────────────────────────────
  mongo-keyfile:
    image: mongo:5
    container_name: ace-mongo-keyfile-${ACE_INSTANCE_NAME:-unconfigured}
    profiles: ["mongo"]
    entrypoint:
      - bash
      - -c
      - 'test -s /keydata/keyfile || { openssl rand -base64 756 > /keydata/keyfile && chmod 400 /keydata/keyfile && chown 999:999 /keydata/keyfile; }'
    volumes:
      - mongo_keyfile:/keydata
    restart: "no"

  mongo:
    image: mongo:5
    container_name: agentcert-mongo-${ACE_INSTANCE_NAME:-unconfigured}
    profiles: ["mongo"]
    # Bridge networking (NOT host) + a published port. The mongo image's
    # user-init step always binds 27017 *inside the container* — on a bridge
    # that can never collide with a 27017 already in use on the host. Map any
    # free host port to the container's 27017 via MONGO_PORT (default 27017).
    ports:
      - "${MONGO_PORT:-27017}:27017"
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    command: ["mongod", "--replSet", "rs0", "--keyFile", "/keydata/keyfile", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-1234}
    volumes:
      - mongodb_data:/data/db
      - mongo_keyfile:/keydata:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGODB_USERNAME:-admin}", "-p", "${MONGODB_PASSWORD:-1234}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # One-shot: initialise the single-node replica set rs0 (idempotent).
  # On the compose network, so it reaches mongo by service name on 27017.
  mongo-init:
    image: mongo:5
    container_name: ace-mongo-init-${ACE_INSTANCE_NAME:-unconfigured}
    profiles: ["mongo"]
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - >
        mongosh --quiet --host mongo:27017
        -u ${MONGODB_USERNAME:-admin} -p ${MONGODB_PASSWORD:-1234} --authenticationDatabase admin
        --eval 'try { if (rs.status().ok) { print("rs0 already initialized"); } }
                catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"localhost:27017"}]}); print("rs0 initiated"); }'
    restart: "no"

  # ── AgentCert authentication service ────────────────────────────────────────
  auth:
    build:
      context: AgentCert/chaoscenter/authentication
      dockerfile: Dockerfile
    image: agentcert/agentcert-auth:latest
    container_name: agentcert-auth-${ACE_INSTANCE_NAME:-unconfigured}
    # Bridge networking (NOT host) + explicit ports: — same pattern as mongo/
    # certifier's `app` service above. Required for reachability under a
    # personal rootless Docker daemon (CLAUDE.md §6): rootless "host" networking
    # is RootlessKit's own private netns, not the real host's, so explicit
    # ports: is the one publishing form that's actually forwarded out.
    ports:
      - "${AUTH_REST_PORT:-3000}:${AUTH_REST_PORT:-3000}"
      - "${AUTH_GRPC_PORT:-3030}:${AUTH_GRPC_PORT:-3030}"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
        required: false
    env_file:
      - .env
    environment:
      # Per-service ports (deliberately NOT in .env — see the .env comment).
      REST_PORT: "${AUTH_REST_PORT:-3000}"
      GRPC_PORT: "${AUTH_GRPC_PORT:-3030}"
      DB_USER: ${MONGODB_USERNAME:-admin}
      DB_PASSWORD: ${MONGODB_PASSWORD:-1234}
      # .env's own DB_SERVER hardcodes 127.0.0.1, which only ever worked because
      # this container shared the real host loopback via network_mode: host.
      # Override to the compose service name — mongo is reachable by Docker DNS
      # from any container on the same (default) network regardless of daemon mode.
      DB_SERVER: "mongodb://${MONGODB_USERNAME:-admin}:${MONGODB_PASSWORD:-1234}@mongo:27017/?replicaSet=rs0&authSource=admin"
    restart: unless-stopped

  # ── AgentCert GraphQL control plane ─────────────────────────────────────────
  graphql:
    build:
      context: AgentCert/chaoscenter/graphql
      dockerfile: server/Dockerfile
    image: agentcert/agentcert-graphql:latest
    container_name: agentcert-graphql-${ACE_INSTANCE_NAME:-unconfigured}
    # Bridge networking (NOT host) + explicit ports:, same reasoning as auth
    # above. graphql additionally needs the `kind` network to reach the KinD
    # control-plane container by Docker DNS (see KUBECONFIG below) — it no
    # longer shares a loopback with KinD's host-published API-server port now
    # that it isn't network_mode: host itself.
    networks:
      default: {}
      kind: {}
    ports:
      - "${GQL_REST_PORT:-8081}:${GQL_REST_PORT:-8081}"
      - "${GQL_GRPC_PORT:-8082}:${GQL_GRPC_PORT:-8082}"
    depends_on:
      cluster-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
        required: false
      auth:
        condition: service_started
    env_file:
      - .env
    environment:
      # Generic per-service ports the binary reads (script mapped GQL_* → these).
      REST_PORT: "${GQL_REST_PORT:-8081}"
      GRPC_PORT: "${GQL_GRPC_PORT:-8082}"
      DB_USER: ${MONGODB_USERNAME:-admin}
      DB_PASSWORD: ${MONGODB_PASSWORD:-1234}
      # .env's own DB_SERVER hardcodes 127.0.0.1 — same fix as auth above, same
      # reason (no longer network_mode: host, so 127.0.0.1 is this container's
      # own private loopback, not mongo's).
      DB_SERVER: "mongodb://${MONGODB_USERNAME:-admin}:${MONGODB_PASSWORD:-1234}@mongo:27017/?replicaSet=rs0&authSource=admin"
      # .env's own default (localhost) only worked via network_mode: host; auth
      # is reachable by Docker DNS from any container on the default network.
      LITMUS_AUTH_GRPC_ENDPOINT: auth
      # Required keys the binary validates under LITMUS_*-prefixed names (the v2
      # script renamed CHAOS_*_IMAGE → LITMUS_CHAOS_*_IMAGE at launch). Not in
      # .env, so they survive godotenv.Overload.
      LITMUS_CHAOS_OPERATOR_IMAGE: ${CHAOS_OPERATOR_IMAGE:-litmuschaos/chaos-operator:3.0.0}
      LITMUS_CHAOS_RUNNER_IMAGE: ${CHAOS_RUNNER_IMAGE:-litmuschaos/chaos-runner:3.0.0}
      LITMUS_CHAOS_EXPORTER_IMAGE: ${CHAOS_EXPORTER_IMAGE:-litmuschaos/chaos-exporter:3.0.0}
      # godotenv.Overload re-reads this file at init, so .env stays authoritative.
      AGENTCERT_ENV_FILE: /srv/projects/ace-monorepo/.env
      # The "internal" kubeconfig cluster-init writes (server: Docker-network
      # DNS name, not 127.0.0.1) — see KUBECONFIG_INTERNAL_OUT on cluster-init
      # and the `kind` network above. Required now that this container is on
      # bridge networking rather than sharing the host's/KinD's loopback.
      KUBECONFIG: /kube/config-internal
      # Computed values the v2 script derived (not present verbatim in .env).
      OPENAI_BASE_URL: ${LITELLM_HOST:-http://172.26.0.1:14000}/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-agentcert-2026}
      MODEL_ALIAS: ${FLASH_AGENT_MODEL:-gpt-4o}
      CHAOS_CENTER_UI_ENDPOINT: ${SUBSCRIBER_CALLBACK_URL:-http://172.26.0.1:8081}
      # Human/kubectl-facing address (distinct from the in-cluster/subscriber one
      # above) — used to build the `kubectl apply -f <url>` manifest-download link
      # so it is correct regardless of what host:port the browser that requested it
      # was tunneled/forwarded through, rather than trusting the browser's own
      # address bar. WEB_PORT is the same host port the web container itself is
      # published on.
      CHAOS_CENTER_PUBLIC_ENDPOINT: ${CHAOS_CENTER_PUBLIC_ENDPOINT:-http://localhost:${WEB_PORT:-2001}}
      # graphql → certifier. Two endpoints, both on the certifier service:
      #   CERTIFIER_BASE_URL       — certification data/scorecard API client
      #   CERTIFICATE_PDF_BASE_URL — the "Download Certificate" PDF proxy
      # Reach it by the `certifier` network alias (see the `app` service's
      # networks.default.aliases below) rather than .env's own localhost
      # default, which only worked via network_mode: host. Override
      # *_BASE_URL_COMPOSE in .env to point at a hosted/Azure certifier instead
      # — same escape-hatch pattern as LANGFUSE_HOST_COMPOSE below.
      # (graphql's code defaults are the dead ports :8088/:8089 → "connection
      # refused", so we always set them here.)
      CERTIFIER_BASE_URL: ${CERTIFIER_BASE_URL_COMPOSE:-http://certifier:8000}
      CERTIFICATE_PDF_BASE_URL: ${CERTIFICATE_PDF_BASE_URL_COMPOSE:-http://certifier:8000}
      DEFAULT_AGENT_HUB_PATH: ${AGENT_CHARTS_ROOT:-/tmp/default}
      AGENT_HUB_SOURCE_MODE: custom
      DEFAULT_APP_HUB_PATH: ${APP_CHARTS_ROOT:-/tmp/default}
      APP_HUB_SOURCE_MODE: custom
      DEFAULT_CHAOS_HUB_PATH: ${CHAOS_CHARTS_ROOT:-/tmp/default}
      HUB_SOURCE_MODE: custom
      PRE_CLEANUP_WAIT_SECONDS: ${PRE_CLEANUP_WAIT_SECONDS:-0}
      # On corporate networks the host has a custom CA bundle (SSL inspection
      # proxy) that the ubi9 base image doesn't know about.  Go checks
      # SSL_CERT_FILE before its compiled-in paths, so pointing it at the
      # host-mounted bundle fixes git clone TLS failures inside the container.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # Override auto-detected containerd socket path. Required for k3s which
      # places its socket at /run/k3s/containerd/containerd.sock instead of the
      # standard /run/containerd/containerd.sock. Set in .env to change without
      # modifying this file.
      CONTAINER_SOCKET_PATH: ${CONTAINER_SOCKET_PATH:-/run/k3s/containerd/containerd.sock}
    volumes:
      # World-readable kubeconfig directory from cluster-init — contains both
      # config (external, 127.0.0.1:<port>, unused by this container) and
      # config-internal (Docker-network DNS, see KUBECONFIG above).
      - kubeconfig:/kube:ro
      # Mount the repo at its own absolute path so AGENT_CHARTS_ROOT /
      # APP_CHARTS_ROOT / AGENTCERT_ENV_FILE (all absolute in .env) resolve.
      - .:/srv/projects/ace-monorepo:ro
      # Mount the host CA bundle so the ubi9 container trusts corporate/proxy
      # CAs when git-cloning chaos-charts over HTTPS (go-git uses Go TLS, not
      # the system git binary, so GIT_SSL_NO_VERIFY has no effect here).
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    restart: unless-stopped

  # ── AgentCert UI ────────────────────────────────────────────────────────────
  web:
    build:
      context: AgentCert/chaoscenter/web
      # Self-build dist (the repo ships no dist/); inline keeps it out of the
      # AgentCert submodule.
      dockerfile_inline: |
        FROM node:20 AS builder
        WORKDIR /web
        COPY . .
        RUN npm install --legacy-peer-deps
        RUN npm run build
        FROM registry.access.redhat.com/ubi8/ubi-minimal:8.10
        RUN microdnf update --nodocs \
            && microdnf module enable nginx:1.20 \
            && microdnf install --nodocs nginx \
            && microdnf clean all
        COPY --from=builder /web/dist /opt/chaos
        RUN chown 65534:0 -R /opt/chaos /var/log/nginx /etc/nginx
        USER 65534
        EXPOSE 2001
        ENTRYPOINT ["sh", "-c", "nginx -c /etc/nginx/nginx.conf -g 'daemon off;'"]
    image: agentcert/agentcert-web:latest
    container_name: agentcert-web-${ACE_INSTANCE_NAME:-unconfigured}
    # Bridge networking (NOT host) + explicit ports: — same reasoning as auth/
    # graphql above. web's nginx proxies to auth/graphql by Docker DNS now
    # (see compose/web-nginx.conf), so it doesn't need the `kind` network.
    ports:
      - "${WEB_PORT:-2001}:2001"
    # Run as root so nginx can read the bind-mounted nginx.conf regardless of
    # host file permissions (git does not preserve permissions beyond the
    # executable bit, so clones on other VMs may produce a file not readable
    # by UID 65534). The non-root USER in the Dockerfile is for OpenShift
    # production images; root is fine for local compose.
    user: "0"
    depends_on:
      graphql:
        condition: service_started
    volumes:
      # Compose-tailored nginx: proxies /auth/→auth:3000 and /api/→graphql:8081
      # by Docker DNS (both containers are on the same default network).
      - ./compose/web-nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  # ── Ollama inference server (profile: ollama) ───────────────────────────────
  # One container per ACE instance (container_name + volume both scoped by
  # ACE_INSTANCE_NAME) so two checkouts on this shared host never collide.
  # OLLAMA_PORT is the host-side port; the system Ollama owns :11434 so this
  # must differ. setup.sh auto-derives a UID-based default; override in .env.
  # Requires NVIDIA Container Toolkit for GPU access. Device request uses CDI
  # (nvidia.com/gpu=all) rather than the legacy `driver: nvidia` reservation so
  # it resolves identically under both daemons on this host: the shared root
  # daemon already publishes a system CDI spec at /etc/cdi, and a personal
  # rootless daemon (./scripts/setup.sh --rootless-docker) gets its own
  # user-scoped spec under $HOME/.config/cdi — neither path touches the other.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-${ACE_INSTANCE_NAME:-unconfigured}
    profiles: ["ollama"]
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Ollama binds to all interfaces inside the container by default.
      OLLAMA_HOST: "0.0.0.0"
    devices:
      - "nvidia.com/gpu=all"
    restart: unless-stopped

  # ── LiteLLM gateway (profile: litellm) ──────────────────────────────────────
  litellm:
    image: ${LITELLM_PROXY_IMAGE:-litellm/litellm:v1.82.0-stable}
    container_name: litellm-proxy-${ACE_INSTANCE_NAME:-unconfigured}
    profiles: ["litellm"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LITELLM_PORT:-14000}:4000"
    env_file:
      - .env
    environment:
      # litellm runs on the compose bridge, so it CANNOT reach Langfuse at the
      # kind-gateway IP (172.26.0.1:4000) used by host/in-cluster callers — those
      # packets are dropped by UFW (port 4000 is allowed only from 172.26.0.0/16).
      # Reach Langfuse by its compose service name instead (same network). For
      # LANGFUSE_MODE=external, set LANGFUSE_HOST_COMPOSE to your external URL.
      LANGFUSE_HOST: ${LANGFUSE_HOST_COMPOSE:-http://langfuse-web:3000}
    volumes:
      - ./agentcert-stack/litellm-setup/litellm_config.yaml:/app/config.yaml:ro
      - litellm-data:/app/data
    command: --config /app/config.yaml --port 4000 --detailed_debug
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Certifier workspace init (one-shot, runs as root) ───────────────────────
  # The certifier runs as uid 1000 (agentcert) and cannot create directories
  # inside a host-mounted volume owned by root. This service pre-creates the
  # workspace tree and chowns it to uid 1000 before the certifier starts.
  workspace-init:
    image: python:3.11-slim
    container_name: ace-workspace-init-${ACE_INSTANCE_NAME:-unconfigured}
    user: root
    command: >
      bash -c "mkdir -p /ws/cert /export && chown -R 1000:1000 /ws /export && chmod 755 /ws /export"
    volumes:
      - ./certifier/workspace:/ws
      # Second, dedicated mount for finished-report export (see CERT_HOST_EXPORT_DIR
      # below on the app service) — kept separate from /ws so the export dir stays
      # a clean, predictable location distinct from intermediate pipeline artefacts.
      - ${CERT_REPORTS_HOST_DIR:-.tmp/certification-reports-${ACE_INSTANCE_NAME:-unconfigured}}:/export
    restart: "no"

  # ── Certifier API (inlined from certifier/docker-compose.yml) ───────────────
  # Defined here rather than `include`d so the mongo dependency + Langfuse
  # override below don't require Compose 2.21+'s included-service merging.
  app:
    build:
      context: ./certifier
      dockerfile: Dockerfile
      target: runtime
    image: ${CERTIFIER_IMAGE:-certifier:latest}
    container_name: certifier_app_${ACE_INSTANCE_NAME:-unconfigured}
    restart: unless-stopped
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
        required: false
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    # Alias so graphql's CERTIFIER_BASE_URL/CERTIFICATE_PDF_BASE_URL
    # (http://certifier:8000) resolve — the compose service name is `app`
    # (see the file-level note above about avoiding the "services.app conflicts
    # with imported resource" error), but `certifier` reads better everywhere
    # else this host is referenced, so keep both names live via an alias
    # instead of renaming the service.
    networks:
      default:
        aliases:
          - certifier
    env_file:
      - .env
    environment:
      # Shared monorepo mongo over host.docker.internal (directConnection bypasses
      # the replica-set topology, which advertises localhost:27017).
      MONGODB_CONNECTION_STRING: "${CERTIFIER_MONGODB_URI:-mongodb://${MONGODB_USERNAME:-admin}:${MONGODB_PASSWORD:-1234}@mongo:27017/${MONGODB_DATABASE:-agentcert}?authSource=admin&directConnection=true}"
      # Reach Langfuse by compose service name, not the kind-gateway IP (which
      # UFW drops for non-172.26 sources). Override for LANGFUSE_MODE=external.
      LANGFUSE_HOST: ${LANGFUSE_HOST_COMPOSE:-http://langfuse-web:3000}
      PYTHONPATH: /app
      API_PORT: "${API_PORT:-8000}"
      WORKSPACE_DIR: /app/workspace
      CERT_WORKSPACE_DIR: /app/workspace/cert
      # Finished HTML/PDF reports are additionally copied here once generated
      # (see certifier/main/workers/cert_task_runner.py) so they're discoverable
      # under .tmp/ without digging through intermediate pipeline artefacts.
      CERT_HOST_EXPORT_DIR: /app/cert-export
    volumes:
      - ./certifier/workspace:/app/workspace
      - ${CERT_REPORTS_HOST_DIR:-.tmp/certification-reports-${ACE_INSTANCE_NAME:-unconfigured}}:/app/cert-export
    healthcheck:
      test: ["CMD", "sh", "-c",
             "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8000}/docs')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Pre-created before any service starts (Compose creates every declared network
# up front, regardless of dependency order) so `kind create cluster` — invoked
# by cluster-init via the bind-mounted docker.sock — can attach its node
# containers to it via KIND_EXPERIMENTAL_DOCKER_NETWORK, and graphql can join
# the same network to reach the control-plane container by Docker DNS. Needed
# because graphql runs on bridge networking + explicit ports: (see below),
# not network_mode: host, so it no longer shares a loopback with the KinD
# node the way a host-networked container would. Checkout-scoped name so two
# checkouts' KinD clusters never share a Docker network on this shared host.
networks:
  kind:
    name: kind-${ACE_INSTANCE_NAME:-unconfigured}

volumes:
  # Scoped by ACE_INSTANCE_NAME so two checkouts on this shared host never
  # share (or silently overwrite) each other's MongoDB data — matches the
  # ollama-models pattern below. Also what makes certifier reports durable
  # across `docker compose down`/up: cert_task_runner.py uploads every
  # generated report to the cert_reports GridFS bucket unconditionally, so
  # Mongo's own durability is what keeps reports around, independent of the
  # certifier/workspace bind mount.
  #
  # One-time migration if you have pre-existing data in the old unscoped
  # `mongodb_data` volume and want to keep it:
  #   docker run --rm -v mongodb_data:/from \
  #     -v mongodb_data-$ACE_INSTANCE_NAME:/to alpine cp -a /from/. /to/
  mongodb_data:
    name: mongodb_data-${ACE_INSTANCE_NAME:-unconfigured}
    driver: local
  mongo_keyfile:
    driver: local
  litellm-data:
    driver: local
  kubeconfig:
    driver: local
  # Fallback empty volumes for cloud cred dirs on non-cloud hosts.
  # Overridden by *_CONFIG_DIR bind-mounts when CLUSTER_MODE=cloud.
  empty-azure-creds:
    driver: local
  empty-aws-creds:
    driver: local
  empty-gcloud-creds:
    driver: local
  # Per-instance Ollama model store — scoped by ACE_INSTANCE_NAME so each
  # checkout has its own isolated model library, no cross-user sharing.
  ollama-models:
    name: ollama-models-${ACE_INSTANCE_NAME:-unconfigured}
    driver: local
